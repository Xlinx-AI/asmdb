name: Build and publish ASMDB

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            architecture: x64
          - runner: ubuntu-24.04
            target: linux-x64
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            architecture: aarch64
          - runner: macos-15-intel
            target: macos-x64
            architecture: x64
            deployment: '10.15'
          - runner: macos-14
            target: macos-arm64
            architecture: arm64
            deployment: '11.0'
    runs-on: ${{ matrix.runner }}
    env:
      ASMDB_TEST_GPU: '0'
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}

      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nasm --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          (Get-Command nasm).Source | Split-Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v

      - name: Install NASM on Intel macOS
        if: matrix.target == 'macos-x64'
        run: brew install nasm

      - name: Build Windows and macOS wheels
        if: runner.os != 'Linux'
        run: |
          python -m pip install build twine
          python -m build --wheel
          python -m twine check dist/*

      - name: Verify installed wheel on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m venv build/wheel-check
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & build/wheel-check/Scripts/python.exe -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/wheel-check/Scripts/python.exe -I -m unittest discover -s tests -v
          exit $LASTEXITCODE

      - name: Verify installed wheel on macOS
        if: runner.os == 'macOS'
        run: |
          python -m venv build/wheel-check
          build/wheel-check/bin/python -m pip install dist/*.whl
          build/wheel-check/bin/python -I -m unittest discover -s tests -v

      - name: Build and verify manylinux wheel
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e ASMDB_TEST_GPU=0 -e ARCH="$ARCH" \
            "quay.io/pypa/manylinux_2_28_$ARCH" /bin/bash -euxo pipefail -c '
              export PATH=/opt/python/cp313-cp313/bin:$PATH
              if [ "$ARCH" = x86_64 ]; then dnf install -y nasm; fi
              python -m pip install build twine auditwheel
              python -m build --wheel --outdir raw-wheels
              auditwheel repair --plat "manylinux_2_28_$ARCH" -w dist raw-wheels/*.whl
              python -m twine check dist/*
              python -m venv /tmp/wheel-check
              /tmp/wheel-check/bin/python -m pip install /project/dist/*.whl
              cd /tmp
              /tmp/wheel-check/bin/python -I -m unittest discover -s /project/tests -v
            '

      - name: Check release tag against package version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import ast, os, pathlib; tree = ast.parse(pathlib.Path('asmdb/__init__.py').read_text()); version = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)); assert os.environ['RELEASE_TAG'].removeprefix('v') == version, 'Release tag and package version differ'"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [wheels, source]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
