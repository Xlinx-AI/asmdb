[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmdb"
dynamic = ["version"]
description = "RAG-oriented vector database with NASM SIMD kernels and an assembly-like query DSL"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
gpu = ["pyopencl>=2024.1"]

[tool.setuptools.package-data]
asmdb = ["_native/*.dll", "_native/*.so", "_native/*.dylib", "kernels/*.cl"]

[tool.setuptools.dynamic]
version = {attr = "asmdb.__version__"}

[project.scripts]
asmdb = "asmdb.cli:main"

[tool.setuptools.packages.find]
include = ["asmdb*"]
